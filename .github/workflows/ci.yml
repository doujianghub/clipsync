name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  lint:
    name: Format and lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  cross-check:
    # 大多数贡献者只有一个平台，最常见的破坏是"另一个平台编译不过"——
    # 尤其是被 #[cfg(target_os)] 挡住的测试模块留下未定义符号。
    # 交叉 check 比完整构建快得多，足以拦住这类问题。
    name: Cross-compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross

      - name: Check Windows target
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc

      - name: Check Intel macOS target
        run: cargo check --workspace --all-targets --target x86_64-apple-darwin

  msrv:
    # rust-version 写在 Cargo.toml 里就该是真的，否则它只是个愿望。
    name: Minimum supported Rust version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Build with MSRV
        run: cargo build --workspace
