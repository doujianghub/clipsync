[package]
name = "clipsync-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Networking for ClipSync: LAN discovery, PAKE pairing, and Noise_IK-encrypted transport."
readme = "../../README.md"

[dependencies]
clipsync-core = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }

# 端到端加密：Noise 协议（默认纯 Rust resolver，无需 C 编译器/ring）。
snow = "0.9"
# 一次性配对码的 PAKE 密钥协商（magic-wormhole 同款，抗中间人）。
spake2 = "0.4"
# 随机源：生成配对码熵、Noise 静态密钥等。
rand = "0.8"
# 配对握手的身份认证标签（BLAKE2s 前缀-MAC）。blake2 已随 snow 缓存，
# 作为直接依赖不引入新下载。
blake2 = "0.10"
# 枚举本机网卡地址。用于通用地识别所有可达路径——不论是物理网卡、
# Tailscale/ZeroTier/Netbird/WireGuard 等覆盖网虚拟网卡，一律作为候选地址，
# 无需针对特定组网产品写适配。
if-addrs = "0.13"
# 帧层的自适应压缩。图片以裸 RGBA 传输，一张 4K 截图 33 MB、压完只剩 6%。
flate2 = { workspace = true }

# macOS 的套接字服务类型（把文件传输声明为后台流量，见 sockopt.rs）。
# libc 尚未导出这几个常量，但 setsockopt 本身要靠它。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
