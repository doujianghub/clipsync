[package]
name = "clipsync-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "clipsync"
path = "src/main.rs"

[dependencies]
clipsync-core = { workspace = true }
clipsync-clip = { workspace = true }
clipsync-net = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
ctrlc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# 系统托盘图标与菜单（跨 Windows/macOS）。
tray-icon = "0.19"

# 文件传输的自适应压缩。flate2 已随 arboard→image→png 缓存，
# 作为直接依赖不引入新下载。
flate2 = "1"

# 托盘需要在主线程上跑平台消息循环。windows-sys 已缓存，仅增 feature。
# Win32_UI_Controls 提供 TaskDialogIndirect——系统原生的现代对话框。
# 用它替代"起 PowerShell 子进程画 WinForms 窗口"：后者外观停留在 2002 年，
# 每次弹窗要多花 100–300ms 起进程，GUI 进程创建控制台子进程时还会闪一下
# 黑框，而且 `powershell -Command -`（从 stdin 喂脚本）是无文件攻击的典型
# 模式，杀软有充分理由拦它。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Foundation",
] }

# macOS 上 tray-icon 依赖 NSApplication 的事件循环才能响应菜单点击。
# 版本对齐 tray-icon 0.19 实际使用的 objc2 0.6 / app-kit 0.3（见 Cargo.lock）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSDate", "NSRunLoop"] }

# 说明：托盘 UI（tray-icon）与异步运行时（tokio）将分别在能编译验证后
# 与 M2 引入。M0 为最小可运行骨架：配置 + 日志 + 优雅退出 + stub 演示。
