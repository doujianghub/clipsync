[package]
name = "clipsync-clip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clipsync-core = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# 跨平台剪贴板读写（文本 + 图片 RGBA）。图片支持来自默认的 image-data feature。
# 文件列表 arboard 不覆盖，留待 M4 用平台特定代码实现。
arboard = "3"

# Windows 平台能力：
#   - 敏感内容探测与剪贴板格式查询（DataExchange）
#   - 文件列表读写 CF_HDROP（UI_Shell 的 DragQueryFileW + Memory 的 GlobalAlloc）
# windows-sys 已随 arboard 缓存，此处仅增加 feature，不引入新下载。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_Foundation",
] }

# macOS 平台能力：
#   - 敏感内容探测（NSPasteboard 的 ConcealedType/TransientType）
#   - 变化令牌 changeCount 与图片格式查询（均只读 NSPasteboard，不打开剪贴板）
#   - 文件列表读写 public.file-url
# 版本对齐 arboard 3.6 与 tray-icon 0.19 实际使用的 objc2 0.6 / app-kit 0.3
# （见 Cargo.lock）。工作区内另有一份 objc2 0.5 是 muda 的传递依赖，与此无关；
# 选 0.6 可与 arboard 共用同一份编译产物，不引入额外下载。
# NSPasteboard feature 已连带启用 NSArray/NSString/NSURL 等所需 Foundation 类型。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = "0.3"
